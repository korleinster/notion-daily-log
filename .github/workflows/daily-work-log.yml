name: Daily Work Log

on:
  workflow_dispatch:

jobs:
  create-daily-log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run daily log script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DAILY_LOG_PAGE_ID: ${{ secrets.DAILY_LOG_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          WORKTASK_DB_ID: ${{ secrets.WORKTASK_DB_ID }}
          MEMBERS_DB_ID: ${{ secrets.MEMBERS_DB_ID }}
          BOARD_PAGE_ID: ${{ secrets.BOARD_PAGE_ID }}
          FIXED_PAGE_ID: ${{ secrets.FIXED_PAGE_ID }}
        run: node index.js
