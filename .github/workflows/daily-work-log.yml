name: Daily Work Log

on:
  schedule:
    # KST 오전 7시 = UTC 전날 22:00
    # 매일 실행 (주말 포함, 스크립트 내에서 중복 방지 처리)
    - cron: '0 22 * * *'
  workflow_dispatch: # 수동 실행도 가능

jobs:
  create-daily-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run daily log script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DAILY_LOG_PAGE_ID: ${{ secrets.DAILY_LOG_PAGE_ID }}
        run: node index.js
