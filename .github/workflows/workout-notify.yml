name: Workout Notify

on:
  schedule:
    # KST 오전 8시 ~ 오후 11시 매시간
    # UTC 기준: 23시(KST 08:00) + 00~14시(KST 09:00~23:00)
    - cron: '0 0-14,23 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Get today's date (KST)
        id: date
        run: echo "date=$(TZ=Asia/Seoul date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: .workout-notify-state.json
          key: workout-state-${{ steps.date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            workout-state-${{ steps.date.outputs.date }}-
            workout-state-

      - name: Run workout notify
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node workout-notify.js

      - name: Save state cache
        uses: actions/cache/save@v4
        with:
          path: .workout-notify-state.json
          key: workout-state-${{ steps.date.outputs.date }}-${{ github.run_id }}
